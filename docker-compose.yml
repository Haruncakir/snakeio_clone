version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: snakeio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: snakeio-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: snakeio
      POSTGRES_PASSWORD: snakeio_secret
      POSTGRES_DB: snakeio
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snakeio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  pg-data:
